<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Pages 图床管理</title>
<style>
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --border:#e4e7ec;
    --text:#1f2328;
    --muted:#6b7280;
    --primary:#2f6feb;
    --primary-hover:#1f5cd6;
    --danger:#d92d20;
    --success:#12b76a;
    --warn:#f79009;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:24px 20px 80px}

  /* ===== Header ===== */
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  header h1{font-size:22px;margin:0;display:flex;align-items:center;gap:10px}
  header h1 svg{width:26px;height:26px}
  .repo-badge{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--border);padding:6px 12px;border-radius:999px}
  .repo-badge b{color:var(--text)}

  /* ===== Token bar ===== */
  .token-bar{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);margin-bottom:18px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .token-bar label{font-size:14px;font-weight:600;white-space:nowrap}
  .token-bar input[type=password],.token-bar input[type=text]{
    flex:1;min-width:240px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;outline:none;
  }
  .token-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,111,235,.15)}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;margin-right:6px;vertical-align:middle}
  .status-dot.ok{background:var(--success)}
  .status-dot.miss{background:var(--warn)}
  .token-status{font-size:13px;color:var(--muted)}

  button{
    cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:500;
    padding:8px 14px;transition:all .15s;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-hover)}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{background:#f3f4f6}
  .btn-danger{background:#fef3f2;color:var(--danger);border:1px solid #fecdca}
  .btn-danger:hover{background:#fee4e2}
  .btn-sm{padding:5px 10px;font-size:12.5px}

  /* ===== Dropzone ===== */
  .dropzone{
    border:2px dashed #c9cfd8;border-radius:var(--radius);background:var(--panel);
    padding:36px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:18px;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--primary);background:#f0f5ff}
  .dropzone .dz-icon{width:44px;height:44px;margin:0 auto 10px;color:var(--muted)}
  .dropzone h3{margin:0 0 6px;font-size:16px}
  .dropzone p{margin:0;font-size:13px;color:var(--muted)}
  .dropzone .formats{margin-top:8px;font-size:12px;color:#9ca3af}

  /* ===== Section title ===== */
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
  .section-head h2{font-size:16px;margin:0}
  .section-head .meta{font-size:13px;color:var(--muted)}

  /* ===== Upload queue ===== */
  .queue{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .queue-item{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    display:flex;align-items:center;gap:12px;font-size:13px;
  }
  .queue-item .q-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .queue-item .q-bar{width:160px;height:6px;background:#eef0f3;border-radius:3px;overflow:hidden}
  .queue-item .q-bar > i{display:block;height:100%;background:var(--primary);width:0;transition:width .2s}
  .queue-item .q-pct{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .queue-item .q-state{font-size:12px;min-width:48px;text-align:center;padding:2px 8px;border-radius:999px}
  .q-state.uploading{background:#eff4ff;color:var(--primary)}
  .q-state.done{background:#ecfdf3;color:var(--success)}
  .q-state.fail{background:#fef3f2;color:var(--danger)}

  /* ===== Gallery grid ===== */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;
  }
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  .card .thumb{
    height:160px;background:#0b0d12;display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .card .thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .card .thumb audio{width:90%}
  .card .thumb .file-icon{color:#6b7280}
  .card .thumb .file-icon svg{width:48px;height:48px}
  .card .body{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .card .fname{
    font-size:13px;font-weight:600;word-break:break-all;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .url-row{display:flex;gap:6px}
  .card .url-row input{
    flex:1;min-width:0;font-size:11.5px;padding:5px 8px;border:1px solid var(--border);
    border-radius:6px;background:#f9fafb;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .card .actions{display:flex;gap:6px}
  .card .actions button{flex:1}
  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);background:var(--panel);
    border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty svg{width:48px;height:48px;margin-bottom:10px;color:#c9cfd8}

  /* ===== Toast ===== */
  #toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:#111827;color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90%;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger)}
  #toast.ok{background:var(--success)}

  @media (max-width:640px){
    .wrap{padding:16px 12px 60px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
    .card .thumb{height:130px}
    .token-bar input[type=password],.token-bar input[type=text]{min-width:100%;font-size:16px}
    .card .url-row input{font-size:16px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg>
      GitHub Pages 图床
    </h1>
    <div class="repo-badge">仓库：<b id="repoLabel">Hoio76 / Hoio</b> · 分支：<b>main</b></div>
  </header>

  <!-- ===== Token 设置 ===== -->
  <div class="token-bar">
    <label for="tokenInput">Access Token</label>
    <input type="password" id="tokenInput" placeholder="输入 GitHub Personal Access Token (repo 权限)" autocomplete="off">
    <button class="btn-primary" id="saveTokenBtn">保存</button>
    <button class="btn-ghost btn-sm" id="toggleTokenBtn">显示</button>
    <span class="token-status" id="tokenStatus"><span class="status-dot miss"></span>未设置</span>
  </div>

  <!-- ===== 上传区 ===== -->
  <div class="dropzone" id="dropzone">
    <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
    </svg>
    <h3>点击选择文件，或将文件拖拽到此处</h3>
    <p>支持多选，自动以 base64 上传到仓库根目录</p>
    <div class="formats">图片：jpg / png / gif / webp / svg / bmp / ico ｜ 音频：mp3 / wav / m4a / ogg / flac / aac</div>
    <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac" hidden>
  </div>

  <!-- ===== 上传队列 ===== -->
  <div class="section-head" id="queueHead" style="display:none">
    <h2>上传队列</h2>
  </div>
  <div class="queue" id="queue"></div>

  <!-- ===== 图库 ===== -->
  <div class="section-head">
    <h2>图库文件</h2>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="meta" id="countMeta">共 0 个文件</span>
      <button class="btn-ghost btn-sm" id="refreshBtn">刷新列表</button>
    </div>
  </div>
  <div id="gallery"></div>

</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  // ===== 配置 =====
  const OWNER = "Hoio76";
  const REPO  = "Hoio";
  const BRANCH = "main";
  const API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents";
  const CDN_BASE = "https://" + OWNER + ".github.io/" + REPO + "/";
  const TOKEN_KEY = "gh_pages_host_token";

  const IMG_EXT = ["jpg","jpeg","png","gif","webp","svg","bmp","ico"];
  const AUD_EXT = ["mp3","wav","m4a","ogg","flac","aac"];

  // ===== 工具 =====
  const $ = s => document.querySelector(s);
  function ext(name){ return (name.split(".").pop()||"").toLowerCase(); }
  function isImage(n){ return IMG_EXT.includes(ext(n)); }
  function isAudio(n){ return AUD_EXT.includes(ext(n)); }
  function toast(msg, type){
    const t = $("#toast");
    t.textContent = msg;
    t.className = "show" + (type ? " " + type : "");
    clearTimeout(t._tm);
    t._tm = setTimeout(()=> t.className = "", 2400);
  }
  function authHeaders(){
    const tok = localStorage.getItem(TOKEN_KEY) || "";
    return {
      "Authorization": "Bearer " + tok,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }

  // ===== Token =====
  function refreshTokenStatus(){
    const tok = localStorage.getItem(TOKEN_KEY);
    const dot = $("#tokenStatus .status-dot");
    const txt = $("#tokenStatus");
    if(tok){
      dot.className = "status-dot ok";
      txt.innerHTML = '<span class="status-dot ok"></span>已保存（' + tok.length + " 位）";
    }else{
      dot.className = "status-dot miss";
      txt.innerHTML = '<span class="status-dot miss"></span>未设置';
    }
  }
  $("#saveTokenBtn").addEventListener("click", ()=>{
    const v = $("#tokenInput").value.trim();
    if(!v){ toast("请输入 Token", "err"); return; }
    localStorage.setItem(TOKEN_KEY, v);
    $("#tokenInput").value = "";
    refreshTokenStatus();
    toast("Token 已保存到浏览器", "ok");
    loadList();
  });
  $("#toggleTokenBtn").addEventListener("click", function(){
    const inp = $("#tokenInput");
    inp.type = inp.type === "password" ? "text" : "password";
    this.textContent = inp.type === "password" ? "显示" : "隐藏";
  });

  // ===== 上传：点击 & 拖拽 =====
  const dz = $("#dropzone");
  const fi = $("#fileInput");
  dz.addEventListener("click", e => { if(e.target.tagName !== "INPUT") fi.click(); });
  fi.addEventListener("change", ()=>{ handleFiles(fi.files); fi.value=""; });
  ["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.add("drag"); }));
  ["dragleave","drop"].forEach(ev => dz.addEventListener(ev, e=>{ e.preventDefault(); e.stopPropagation(); dz.classList.remove("drag"); }));
  dz.addEventListener("drop", e=>{
    if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });
  window.addEventListener("dragover", e=>e.preventDefault());
  window.addEventListener("drop", e=>e.preventDefault());

  function handleFiles(fileList){
    const files = Array.from(fileList);
    if(!files.length) return;
    const bad = files.filter(f => !isImage(f.name) && !isAudio(f.name));
    if(bad.length){
      toast("跳过不支持的格式：" + bad.map(f=>f.name).join(", "), "err");
    }
    const ok = files.filter(f => isImage(f.name) || isAudio(f.name));
    if(!ok.length) return;
    if(!localStorage.getItem(TOKEN_KEY)){ toast("请先设置 Access Token", "err"); return; }
    $("#queueHead").style.display = "";
    ok.forEach(uploadFile);
  }

  // ===== 单个文件上传（XHR 带进度） =====
  function uploadFile(file){
    const reader = new FileReader();
    reader.onload = ()=>{
      // base64, strip data:...;base64,
      const b64 = reader.result.split(",")[1];
      pushQueueItem(file.name, b64);
    };
    reader.readAsDataURL(file);
  }

  function pushQueueItem(name, b64){
    const q = $("#queue");
    const item = document.createElement("div");
    item.className = "queue-item";
    item.innerHTML =
      '<span class="q-name" title=""></span>' +
      '<span class="q-bar"><i></i></span>' +
      '<span class="q-pct">0%</span>' +
      '<span class="q-state uploading">上传中</span>';
    item.querySelector(".q-name").textContent = name;
    item.querySelector(".q-name").title = name;
    q.appendChild(item);

    const bar = item.querySelector(".q-bar > i");
    const pct = item.querySelector(".q-pct");
    const state = item.querySelector(".q-state");

    const xhr = new XMLHttpRequest();
    xhr.open("PUT", API + "/" + encodeURIComponent(name));
    xhr.setRequestHeader("Authorization", "Bearer " + (localStorage.getItem(TOKEN_KEY)||""));
    xhr.setRequestHeader("Accept", "application/vnd.github+json");
    xhr.setRequestHeader("X-GitHub-Api-Version", "2022-11-28");

    xhr.upload.onprogress = e=>{
      if(e.lengthComputable){
        const p = Math.round(e.loaded / e.total * 100);
        bar.style.width = p + "%";
        pct.textContent = p + "%";
      }
    };
    xhr.onload = ()=>{
      if(xhr.status >= 200 && xhr.status < 300){
        bar.style.width = "100%"; pct.textContent = "100%";
        state.className = "q-state done"; state.textContent = "成功";
        toast("「" + name + "」上传成功", "ok");
        setTimeout(()=>{ item.remove(); maybeHideQueue(); loadList(); }, 800);
      }else{
        state.className = "q-state fail"; state.textContent = "失败";
        let msg = "HTTP " + xhr.status;
        try{ const j = JSON.parse(xhr.responseText); if(j.message) msg = j.message; }catch(_){}
        pct.textContent = "—";
        toast("上传失败：" + name + "（" + msg + "）", "err");
      }
    };
    xhr.onerror = ()=>{
      state.className = "q-state fail"; state.textContent = "失败";
      pct.textContent = "—";
      toast("网络错误：" + name, "err");
    };
    xhr.send(JSON.stringify({
      message: "upload " + name,
      content: b64,
      branch: BRANCH
    }));
  }

  function maybeHideQueue(){
    if(!$("#queue").children.length) $("#queueHead").style.display = "none";
  }

  // ===== 列表 =====
  $("#refreshBtn").addEventListener("click", loadList);

  async function loadList(){
    const gal = $("#gallery");
    if(!localStorage.getItem(TOKEN_KEY)){
      gal.innerHTML = emptyHTML("请先在顶部填入并保存 Access Token");
      $("#countMeta").textContent = "共 0 个文件";
      return;
    }
    try{
      const res = await fetch(API + "?ref=" + BRANCH, { headers: authHeaders() });
      if(res.status === 401){ gal.innerHTML = emptyHTML("Token 无效或已过期，请重新设置"); return; }
      if(res.status === 404){ gal.innerHTML = emptyHTML("仓库不存在或无访问权限"); return; }
      if(!res.ok) throw new Error("HTTP " + res.status);
      const list = await res.json();
      const files = list
        .filter(f => f.type === "file" && (isImage(f.name) || isAudio(f.name)))
        .sort((a,b) => (a.name||"").localeCompare(b.name||""));
      $("#countMeta").textContent = "共 " + files.length + " 个文件";
      renderCards(files);
    }catch(err){
      gal.innerHTML = emptyHTML("加载失败：" + err.message);
    }
  }

  function emptyHTML(msg){
    return '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5-9 9"/></svg>' +
      "<div>" + msg + "</div></div>";
  }

  function renderCards(files){
    const gal = $("#gallery");
    if(!files.length){ gal.innerHTML = emptyHTML("暂无文件，先上传一张吧"); return; }
    gal.innerHTML = "";
    files.forEach(f => gal.appendChild(buildCard(f)));
  }

  function buildCard(f){
    const url = CDN_BASE + encodeURIComponent(f.name);
    const card = document.createElement("div");
    card.className = "card";

    let thumb;
    if(isImage(f.name)){
      thumb = '<div class="thumb"><img loading="lazy" src="' + url + '" alt=""></div>';
    }else if(isAudio(f.name)){
      thumb = '<div class="thumb" style="background:#fff;padding:0 12px;align-items:center">' +
              '<audio controls preload="none" src="' + url + '" style="width:100%"></audio></div>';
    }else{
      thumb = '<div class="thumb"><div class="file-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div></div>';
    }

    card.innerHTML =
      thumb +
      '<div class="body">' +
        '<div class="fname" title="' + escapeAttr(f.name) + '">' + escapeHTML(f.name) + '</div>' +
        '<div class="url-row"><input type="text" readonly value="' + escapeAttr(url) + '"></div>' +
        '<div class="actions">' +
          '<button class="btn-ghost btn-sm act-copy">复制</button>' +
          '<button class="btn-ghost btn-sm act-open">打开</button>' +
          '<button class="btn-danger btn-sm act-del">删除</button>' +
        '</div>' +
      '</div>';

    card.querySelector(".act-copy").addEventListener("click", ()=>{
      navigator.clipboard.writeText(url).then(
        ()=>toast("链接已复制", "ok"),
        ()=>{
          const inp = card.querySelector(".url-row input");
          inp.select(); document.execCommand("copy");
          toast("链接已复制", "ok");
        }
      );
    });
    card.querySelector(".act-open").addEventListener("click", ()=> window.open(url, "_blank"));
    card.querySelector(".act-del").addEventListener("click", ()=> deleteFile(f.name, f.sha, card));
    return card;
  }

  async function deleteFile(name, sha, cardEl){
    if(!confirm('确定删除「' + name + '」？此操作不可恢复。')) return;
    try{
      const res = await fetch(API + "/" + encodeURIComponent(name), {
        method: "DELETE",
        headers: authHeaders(),
        body: JSON.stringify({ message: "delete " + name, sha: sha, branch: BRANCH })
      });
      if(res.ok){
        toast("已删除：" + name, "ok");
        cardEl.style.transition = "opacity .2s";
        cardEl.style.opacity = "0";
        setTimeout(()=>{ cardEl.remove(); loadList(); }, 200);
      }else{
        let msg = "HTTP " + res.status;
        try{ const j = await res.json(); if(j.message) msg = j.message; }catch(_){}
        toast("删除失败：" + msg, "err");
      }
    }catch(err){
      toast("删除失败：" + err.message, "err");
    }
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  }
  function escapeAttr(s){ return escapeHTML(s); }

  // ===== 初始化 =====
  refreshTokenStatus();
  loadList();
})();
</script>
</body>
</html>
